<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yutri — Sistema Financiero</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F7F7F5;color:#2C2C2A;min-height:100vh}
.topnav{background:#1D9E75;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.topnav h1{color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.topnav-actions{display:flex;gap:8px}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:200px;background:#fff;border-right:1px solid #e8e8e5;padding:14px 0;flex-shrink:0}
.side-item{padding:10px 20px;font-size:13px;color:#5F5E5A;cursor:pointer;display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
.side-item:hover{background:#fafaf8;color:#2C2C2A}
.side-item.active{background:#E1F5EE;color:#0F6E56;border-left-color:#1D9E75;font-weight:700}
.side-section{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#aaa;padding:14px 20px 6px;font-weight:700}
.main{flex:1;padding:20px 24px;max-width:1300px}
.btn{padding:7px 14px;border-radius:6px;border:1px solid #ccc;background:#fff;color:#2C2C2A;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:Arial,sans-serif}
.btn:hover{background:#f0f0ee}
.btn-green{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn-green:hover{background:#0F6E56;border-color:#0F6E56}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{color:#A32D2D;border-color:#F09595}
.btn-danger:hover{background:#FCEBEB}
h2.page-title{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:#888780;margin-bottom:18px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.metric{background:#fff;border-radius:8px;padding:12px 14px;border:1px solid #e8e8e5}
.metric .lbl{font-size:11px;color:#888780;margin-bottom:4px}
.metric .val{font-size:22px;font-weight:700}
.metric .sub{font-size:11px;color:#aaa;margin-top:2px}
.m-green .val{color:#1D9E75}
.m-red .val{color:#A32D2D}
.m-blue .val{color:#185FA5}
.m-amber .val{color:#BA7517}
.m-gray .val{color:#5F5E5A}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar-left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:7px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px;font-family:Arial,sans-serif;background:#fff;color:#2C2C2A}
.toolbar input[type=text],.toolbar input[type=search]{width:180px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #e8e8e5}
thead{background:#2C2C2A}
th{text-align:left;padding:10px 12px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f0f0ee;color:#2C2C2A;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
td.nowrap{white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.b-ingreso{background:#EAF3DE;color:#3B6D11}
.b-egreso{background:#FCEBEB;color:#A32D2D}
.b-cat{background:#E6F1FB;color:#185FA5}
.b-prueba{background:#FAEEDA;color:#854F0B}
.b-semanal{background:#E1F5EE;color:#0F6E56}
.b-mensual{background:#E6F1FB;color:#185FA5}
.b-personal{background:#EEEDFE;color:#3C3489}
.empty{text-align:center;padding:40px;color:#aaa;font-size:14px;background:#fff;border-radius:8px;border:1px solid #e8e8e5}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:540px;margin:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:18px;color:#2C2C2A}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg label{font-size:12px;color:#888780;font-weight:600}
.fg input,.fg select,.fg textarea{padding:8px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px;font-family:Arial,sans-serif;color:#2C2C2A;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#1D9E75;box-shadow:0 0 0 2px rgba(29,158,117,.12)}
.fg textarea{min-height:55px;resize:vertical}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid #f0f0ee}
.section-title{font-size:13px;font-weight:700;color:#2C2C2A;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.card{background:#fff;border-radius:8px;border:1px solid #e8e8e5;padding:18px;margin-bottom:14px}
.row-flex{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f3;font-size:13px}
.row-flex:last-child{border-bottom:none}
.row-flex.total{font-weight:700;font-size:14px;border-top:2px solid #2C2C2A;padding-top:10px;margin-top:4px}
tr.total-row td{font-weight:700;background:#fafaf8;border-top:2px solid #2C2C2A}
.row-flex .v-pos{color:#1D9E75;font-weight:700}
.row-flex .v-neg{color:#A32D2D;font-weight:700}
.indent{padding-left:16px;color:#888780}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;width:170px;flex-shrink:0;color:#5F5E5A}
.bar-track{flex:1;height:18px;background:#f0f0ee;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:#1D9E75;border-radius:4px}
.bar-val{font-size:12px;font-weight:700;width:90px;text-align:right;flex-shrink:0}
@media(max-width:900px){
  .layout{flex-direction:column}
  .sidebar{width:100%;display:flex;overflow-x:auto;padding:8px}
  .side-section{display:none}
  .side-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent}
  .side-item.active{border-left:none;border-bottom-color:#1D9E75}
  .grid2{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .fg.full{grid-column:1}
  .main{padding:14px}
}
</style>
</head>
<body>

<div class="topnav">
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 7l10-5 10 5M2 7v10l10 5 10-5V7"/></svg>
    Yutri — Sistema Financiero
  </h1>
  <div class="topnav-actions">
    <span id="syncStatus" style="font-family:Arial,sans-serif;font-size:12px;color:rgba(255,255,255,.85);margin-right:6px;">conectando…</span>
    <button class="btn" style="color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15)" onclick="exportAll()">⬇ Exportar todo (JSON)</button>
    <label class="btn" style="color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15);cursor:pointer">
      ⬆ Importar
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAll(event)">
    </label>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="side-section">Resumen</div>
    <div class="side-item active" data-page="dashboard" onclick="goTo(this)"><i>📊</i> Estado de resultados</div>
    <div class="side-item" data-page="rentabilidad" onclick="goTo(this)"><i>📈</i> Rentabilidad</div>
    <div class="side-item" data-page="costocliente" onclick="goTo(this)"><i>🍱</i> Costo por cliente</div>
    <div class="side-section">Registros</div>
    <div class="side-item" data-page="ventas" onclick="goTo(this)"><i>💰</i> Libro de ventas</div>
    <div class="side-item" data-page="compras" onclick="goTo(this)"><i>🛒</i> Libro de compras</div>
    <div class="side-item" data-page="fijos" onclick="goTo(this)"><i>📌</i> Costos fijos</div>
    <div class="side-item" data-page="proyeccion" onclick="goTo(this)"><i>🔮</i> Proyección de costos</div>
    <div class="side-section">Configuración</div>
    <div class="side-item" data-page="config" onclick="goTo(this)"><i>⚙️</i> Planes y precios</div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="overlay" id="overlay">
<div class="modal" id="modal-body"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// DATA MODEL
// ════════════════════════════════════════════════════════════════════
var DEFAULT_DATA = {
  planes: [
    {id:'p1',nombre:'Prueba 1500 kcal',dias:2,precio:190000},
    {id:'p2',nombre:'Prueba 2000 kcal',dias:2,precio:210000},
    {id:'p3',nombre:'Semanal 1500 kcal',dias:5,precio:460000},
    {id:'p4',nombre:'Semanal 2000 kcal',dias:5,precio:500000},
    {id:'p5',nombre:'Mensual 1500 kcal',dias:20,precio:1760000},
    {id:'p6',nombre:'Mensual 2000 kcal',dias:20,precio:1900000},
    {id:'p7',nombre:'Personalizado Semanal 1500',dias:5,precio:520000},
    {id:'p8',nombre:'Personalizado Semanal 2000',dias:5,precio:560000},
    {id:'p9',nombre:'Personalizado Mensual 1500',dias:20,precio:1950000},
    {id:'p10',nombre:'Personalizado Mensual 2000',dias:20,precio:2100000},
    {id:'p11',nombre:'Almuerzo y Cena Prueba 1500',dias:2,precio:160000},
    {id:'p12',nombre:'Almuerzo y Cena Prueba 2000',dias:2,precio:168000},
    {id:'p13',nombre:'Almuerzo y Cena Semanal 1500',dias:5,precio:380000},
    {id:'p14',nombre:'Almuerzo y Cena Semanal 2000',dias:5,precio:400000},
    {id:'p15',nombre:'Almuerzo y Cena Mensual 1500',dias:20,precio:1390000},
    {id:'p16',nombre:'Almuerzo y Cena Mensual 2000',dias:20,precio:1470000}
  ],
  ventas: [],
  compras: [],
  fijos: [
    {id:'f1',concepto:'Alquiler',monto:0},
    {id:'f2',concepto:'Sueldos',monto:0},
    {id:'f3',concepto:'Bebedero',monto:0},
    {id:'f4',concepto:'Luz',monto:0},
    {id:'f5',concepto:'Agua',monto:0},
    {id:'f6',concepto:'Internet',monto:0}
  ],
  fijosPagos: [],
  categoriasCompra: ['Ingredientes','Packaging / Envases','Delivery / Combustible','Marketing','Servicios (luz, agua, internet)','Alquiler','Sueldos','Mantenimiento / Equipos','Otros'],
  proveedores: [],
  clientes: [],
  costoCliente: {
    comida4: {prueba:66000, semanal:165000, mensual:660000},
    comidaAyC: {prueba:46000, semanal:115000, mensual:460000},
    bolsa4: {prueba:1296, semanal:3240, mensual:12960},
    bolsaAyC_conDelivery: {prueba:1500, semanal:3750, mensual:15000},
    caja4: {prueba:18400, semanal:46000, mensual:184000},
    cajaAyC: {prueba:9200, semanal:23000, mensual:92000},
    deliveryIncluido: {prueba:15000, semanal:45000, mensual:180000},
    precios4: {prueba:95000, semanal:92000, mensual:88000},
    preciosAyC: {prueba:80000, semanal:76000, mensual:69500},
    comisionAyC: {prueba:0, semanal:50000, mensual:100000},
    comision4: {prueba:0, semanal:50000, mensual:100000},
    deliveryDia: 9000,
    comidaDia4: 30000,
    bolsaDia4: 648,
    cajaDia4: 9200,
    comidaDiaAyC: 33000,
    bolsaDiaAyC: 648,
    cajaDiaAyC: 9200
  }
};

var data = loadData();

function loadData(){
  try{
    var raw = localStorage.getItem('yutri_finanzas');
    if(raw){
      var parsed = JSON.parse(raw);
      // ensure all keys exist
      for(var k in DEFAULT_DATA){ if(!(k in parsed)) parsed[k]=DEFAULT_DATA[k]; }
      // Migrar planes nuevos de Almuerzo y Cena si no existen
      var planesNuevos=['p11','p12','p13','p14','p15','p16'];
      planesNuevos.forEach(function(pid){
        if(!parsed.planes.find(function(p){return p.id===pid;})){
          var def=DEFAULT_DATA.planes.find(function(p){return p.id===pid;});
          if(def) parsed.planes.push(def);
        }
      });
      // migrate old fijos format (had .mes per entry) to new concept-based structure
      if(parsed.fijos.length && parsed.fijos[0].hasOwnProperty('mes')){
        var oldFijos=parsed.fijos;
        var conceptMap={};
        var nuevos=[];
        var pagos=[];
        oldFijos.forEach(function(f){
          var key=f.concepto;
          if(!conceptMap[key]){
            var c={id:uid(),concepto:f.concepto,monto:f.monto};
            conceptMap[key]=c;
            nuevos.push(c);
          }
          pagos.push({id:uid(),conceptoId:conceptMap[key].id,mes:f.mes,monto:f.monto,pagado:false});
        });
        parsed.fijos=nuevos;
        parsed.fijosPagos=pagos;
      }
      if(!parsed.clientes.length && parsed.ventas.length){
        var set={};
        parsed.ventas.forEach(function(v){ if(v.cliente) set[v.cliente]=true; });
        parsed.clientes=Object.keys(set).sort();
      }
      return parsed;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
var FIREBASE_FIN_URL='https://yutri-control-de-menu-default-rtdb.firebaseio.com/finanzas_app.json';
var saveTimer=null;
function setSyncStatus(txt){
  var el=document.getElementById('syncStatus');
  if(el) el.textContent=txt;
}
function saveData(){
  try{ localStorage.setItem('yutri_finanzas', JSON.stringify(data)); }catch(e){}
  setSyncStatus('guardando…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    fetch(FIREBASE_FIN_URL,{method:'PUT',body:JSON.stringify(data)})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); setSyncStatus('guardado ✓'); })
      .catch(function(e){ console.error(e); setSyncStatus('⚠ sin conexión — guardado solo en este dispositivo'); });
  },600);
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fmtGs(n){ n=Math.round(n||0); return 'Gs ' + n.toLocaleString('es-PY'); }
function fmtPct(n){ if(!isFinite(n)) return '—'; return (Math.round(n*10)/10).toLocaleString('es-PY') + '%'; }
function monthLabel(ym){
  var meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var parts=ym.split('-'); return meses[parseInt(parts[1])-1]+' '+parts[0];
}
function todayYM(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function ymOf(dateStr){ return dateStr.slice(0,7); }

// ════════════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════════════
var currentPage='dashboard';
function goTo(el){
  currentPage=el.dataset.page;
  document.querySelectorAll('.side-item').forEach(function(i){i.classList.remove('active')});
  el.classList.add('active');
  render();
}
function render(){
  if(currentPage==='dashboard') renderDashboard();
  else if(currentPage==='rentabilidad') renderRentabilidad();
  else if(currentPage==='costocliente') renderCostoCliente();
  else if(currentPage==='ventas') renderVentas();
  else if(currentPage==='compras') renderCompras();
  else if(currentPage==='fijos') renderFijos();
  else if(currentPage==='proyeccion') renderProyeccion();
  else if(currentPage==='config') renderConfig();
}

// ════════════════════════════════════════════════════════════════════
// HELPERS: month list / filters
// ════════════════════════════════════════════════════════════════════
function allMonths(){
  var set={};
  data.ventas.forEach(function(v){set[ymOf(v.fecha)]=true});
  data.compras.forEach(function(c){set[ymOf(c.fecha)]=true});
  data.fijosPagos.forEach(function(f){set[f.mes]=true});
  set[todayYM()]=true;
  return Object.keys(set).sort();
}
function monthSelector(id, selected, onchange){
  var months=allMonths();
  var h='<select id="'+id+'" onchange="'+onchange+'">';
  months.forEach(function(m){
    h+='<option value="'+m+'" '+(m===selected?'selected':'')+'>'+monthLabel(m)+'</option>';
  });
  h+='</select>';
  return h;
}

// ════════════════════════════════════════════════════════════════════
// CALCULATIONS
// ════════════════════════════════════════════════════════════════════
function ventasDelMes(ym){
  var result=[];
  // IDs de ventas originales que tienen tramos (para evitar doble conteo con _esDevengado)
  var conTramos={};
  data.ventas.forEach(function(v){ if(v.tramos&&v.tramos.length>1) conTramos[v.id]=true; });

  data.ventas.forEach(function(v){
    if(v._esDevengado){
      // Saltar si el padre ya tiene tramos (ya se muestra via tramo)
      if(v.devengadoDe && conTramos[v.devengadoDe]) return;
      if(ymOf(v.fecha)===ym) result.push(v);
    } else if(v.tramos&&v.tramos.length>1){
      var tramo=v.tramos.find(function(t){return t.ym===ym});
      if(tramo){
        result.push(Object.assign({},v,{
          monto:tramo.monto,
          delivery:tramo.delivery||0,
          fecha: ym===v.tramos[0].ym ? v.fecha : ym+'-01',
          _tramoMes: ym
        }));
      }
    } else {
      if(ymOf(v.fecha)===ym) result.push(v);
    }
  });
  return result;
}
function comprasDelMes(ym){ return data.compras.filter(function(c){return ymOf(c.fecha)===ym}); }
function fijosDelMes(ym){
  return data.fijos.map(function(concepto){
    var pago=data.fijosPagos.find(function(p){return p.conceptoId===concepto.id&&p.mes===ym});
    return {
      id: pago?pago.id:null,
      conceptoId: concepto.id,
      concepto: concepto.concepto,
      monto: pago?pago.monto:concepto.monto,
      pagado: pago?!!pago.pagado:false,
      mes: ym
    };
  });
}
function getOrCreatePago(conceptoId, ym){
  var pago=data.fijosPagos.find(function(p){return p.conceptoId===conceptoId&&p.mes===ym});
  if(!pago){
    var concepto=data.fijos.find(function(c){return c.id===conceptoId});
    pago={id:uid(),conceptoId:conceptoId,mes:ym,monto:concepto?concepto.monto:0,pagado:false};
    data.fijosPagos.push(pago);
  }
  return pago;
}

function sum(arr,key){ return arr.reduce(function(a,b){return a+(parseFloat(b[key])||0)},0); }
function sumDelivery(arr){ return arr.reduce(function(a,b){return a+(b.deliveryPagado?0:(parseFloat(b.delivery)||0))},0); }

function estadoResultados(ym){
  var ventas=ventasDelMes(ym);
  var compras=comprasDelMes(ym);
  var fijos=fijosDelMes(ym);

  var ingresos = sum(ventas,'monto');

  // costo de ventas = compras de categoría "Ingredientes" + "Packaging / Envases" (costo variable directo)
  var costoVariableCats=['Ingredientes','Packaging / Envases'];
  var costoVentas = sum(compras.filter(function(c){return costoVariableCats.includes(c.categoria)}),'monto');

  var utilidadBruta = ingresos - costoVentas;

  // gastos operativos = otras compras (no costo variable) + fijos
  var gastosCompras = sum(compras.filter(function(c){return !costoVariableCats.includes(c.categoria)}),'monto');
  var gastosFijos = sum(fijos,'monto');
  var gastosOperativos = gastosCompras + gastosFijos;

  var utilidadOperativa = utilidadBruta - gastosOperativos;

  return {
    ingresos:ingresos, costoVentas:costoVentas, utilidadBruta:utilidadBruta,
    gastosCompras:gastosCompras, gastosFijos:gastosFijos, gastosOperativos:gastosOperativos,
    utilidadOperativa:utilidadOperativa,
    margenBruto: ingresos? (utilidadBruta/ingresos*100):0,
    margenNeto: ingresos? (utilidadOperativa/ingresos*100):0,
    ventas:ventas, compras:compras, fijos:fijos,
    deliveryPendienteTotal: sumDelivery(ventas)
  };
}

// ════════════════════════════════════════════════════════════════════
// DASHBOARD - ESTADO DE RESULTADOS
// ════════════════════════════════════════════════════════════════════
var dashMonth = todayYM();
function renderDashboard(){
  var er = estadoResultados(dashMonth);
  var catBreak = {};
  er.compras.forEach(function(c){ catBreak[c.categoria]=(catBreak[c.categoria]||0)+parseFloat(c.monto||0); });

  var h = '<h2 class="page-title">Estado de resultados</h2>';
  h += '<div class="page-sub">Resumen mensual de ingresos, costos y rentabilidad</div>';

// ── DEVENGAMIENTO (días hábiles lun-vie) ────────────────────────────────────
function deliveriesEnRango(fechaInicio, fechaFin){
  // Cuenta lunes, miércoles y viernes entre fechaInicio y fechaFin (inclusive)
  var start=new Date(fechaInicio+'T00:00:00');
  var end=new Date(fechaFin+'T00:00:00');
  var count=0;
  var d=new Date(start);
  while(d<=end){
    var dow=d.getDay();
    if(dow===1||dow===3||dow===5) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}
function calcDevengamientoDelivery(fechaInicio, totalDiasHabil, montoDelivery){
  // Distribuye el delivery según cuántos lun/mié/vie caen en cada mes
  if(!montoDelivery) return [{ym:ymOf(fechaInicio),delivery:0}];
  var ymInicio=ymOf(fechaInicio);
  var y=parseInt(ymInicio.slice(0,4)),mo=parseInt(ymInicio.slice(5,7));

  // Calcular fecha fin aproximada del plan (totalDiasHabil días hábiles desde inicio)
  var d=new Date(fechaInicio+'T00:00:00');
  var contados=0;
  while(contados<totalDiasHabil){
    var dow=d.getDay();
    if(dow>=1&&dow<=5) contados++;
    if(contados<totalDiasHabil) d.setDate(d.getDate()+1);
  }
  var fechaFin=d.toISOString().slice(0,10);

  // Fin del mes de inicio
  var finMesInicio=new Date(y,mo,0).toISOString().slice(0,10);
  var delEste=deliveriesEnRango(fechaInicio, finMesInicio<fechaFin?finMesInicio:fechaFin);
  var delTotal=deliveriesEnRango(fechaInicio, fechaFin);
  if(delTotal===0) return [{ym:ymInicio,delivery:montoDelivery}];

  var montoEste=Math.round(montoDelivery*(delEste/delTotal));
  var montoSig=montoDelivery-montoEste;
  var result=[{ym:ymInicio,delivery:montoEste,deliveries:delEste}];
  if(montoSig>0){
    var ymSig=(mo===12?y+1:y)+'-'+String(mo===12?1:mo+1).padStart(2,'0');
    result.push({ym:ymSig,delivery:montoSig,deliveries:delTotal-delEste});
  }
  return result;
}
function diasHabilesEnMes(ym){
  // Cuenta lunes a viernes en el mes ym
  var y=parseInt(ym.slice(0,4)),m=parseInt(ym.slice(5,7));
  var d=new Date(y,m-1,1);
  var count=0;
  while(d.getMonth()===m-1){
    var dow=d.getDay();
    if(dow>=1&&dow<=5) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}
function diasHabilesDesde(fechaInicio, ym){
  // Días hábiles desde fechaInicio hasta fin del mes ym (inclusive)
  var y=parseInt(ym.slice(0,4)),m=parseInt(ym.slice(5,7));
  var start=new Date(fechaInicio+'T00:00:00');
  var ymStart=ymOf(fechaInicio);
  // Si el inicio es de un mes diferente, contar todo el mes
  if(ymStart!==ym) return diasHabilesEnMes(ym);
  var endOfMonth=new Date(y,m,0); // último día del mes
  var count=0;
  var d=new Date(start);
  while(d<=endOfMonth){
    var dow=d.getDay();
    if(dow>=1&&dow<=5) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}
function primerDiaMesSiguiente(ym){
  var y=parseInt(ym.slice(0,4)),m=parseInt(ym.slice(5,7));
  if(m===12){y++;m=1;}else{m++;}
  return y+'-'+String(m).padStart(2,'0')+'-01';
}
function calcDevengamientoHabil(fechaInicio, totalDiasHabil, montoTotal, montoDelivery){
  var ymInicio=ymOf(fechaInicio);
  var diasEnEste=diasHabilesDesde(fechaInicio, ymInicio);
  var diasEste=Math.min(diasEnEste, totalDiasHabil);
  var diasSig=totalDiasHabil-diasEste;
  var montoEste=Math.round(montoTotal*(diasEste/totalDiasHabil));
  var montoSig=montoTotal-montoEste;

  // Delivery tramos
  var delTramos=montoDelivery>0?calcDevengamientoDelivery(fechaInicio,totalDiasHabil,montoDelivery):[];

  var result=[{ym:ymInicio, monto:montoEste, dias:diasEste,
    delivery:delTramos.length>0?delTramos[0].delivery:0,
    deliveries:delTramos.length>0?delTramos[0].deliveries:0}];
  if(diasSig>0){
    var y=parseInt(ymInicio.slice(0,4)),m=parseInt(ymInicio.slice(5,7));
    if(m===12){y++;m=1;}else{m++;}
    var ymSig=y+'-'+String(m).padStart(2,'0');
    result.push({ym:ymSig, monto:montoSig, dias:diasSig,
      delivery:delTramos.length>1?delTramos[1].delivery:0,
      deliveries:delTramos.length>1?delTramos[1].deliveries:0});
  }
  return result;
}

  var html='<div style="font-size:12px;font-weight:700;color:#185FA5;margin-bottom:6px">📊 Devengamiento automático (días hábiles):</div>';
  tramos.forEach(function(t,i){

function crearRegistroDevengado(ventaOriginal, tramo){
  var fechaReg=primerDiaMesSiguiente(ymOf(ventaOriginal.fecha));
  var yaExiste=data.ventas.find(function(v){
    return v.devengadoDe===ventaOriginal.id && ymOf(v.fecha)===tramo.ym;
  });
  if(yaExiste){
    yaExiste.monto=tramo.monto;
    yaExiste.delivery=tramo.delivery||0;
    return;
  }
  data.ventas.push({
    id:uid(),
    fecha:fechaReg,
    cliente:ventaOriginal.cliente,
    plan:ventaOriginal.plan,
    monto:tramo.monto,
    delivery:tramo.delivery||0,
    deliveryPagado:false,
    metodo:ventaOriginal.metodo,
    notas:'Devengado de '+monthLabel(ymOf(ventaOriginal.fecha)),
    devengadoDe:ventaOriginal.id,
    _esDevengado:true
  });
}

function guardarVenta(id){
  var fecha=document.getElementById('mv-fecha').value;
  var clienteSel=document.getElementById('mv-cliente').value;
  var cliente=clienteSel;
  if(clienteSel==='__nuevo__'){
    cliente=document.getElementById('mv-cliente-nuevo').value.trim();
    if(cliente && !data.clientes.includes(cliente)){
      data.clientes.push(cliente);
      data.clientes.sort();
    }
  }
  var plan=document.getElementById('mv-plan').value;
  var monto=parseFloat(document.getElementById('mv-monto').value)||0;
  var delivery=parseFloat(document.getElementById('mv-delivery').value)||0;
  var deliveryPagado=document.getElementById('mv-delivery-pagado').checked;
  var metodo=document.getElementById('mv-metodo').value;
  var notas=document.getElementById('mv-notas').value;
  var planInicio=document.getElementById('mv-inicio').value||fecha;
  if(!fecha||!cliente||!monto){alert('Completá fecha, cliente y monto.');return}

  // Calcular devengamiento por días hábiles
  var sel=document.getElementById('mv-plan');
  var opt=sel?sel.options[sel.selectedIndex]:null;
  var diasPlan=opt?parseInt(opt.getAttribute('data-dias'))||0:0;
  var tramos=diasPlan>0?calcDevengamientoHabil(planInicio,diasPlan,monto,delivery):[];

  var baseObj={fecha:fecha,cliente:cliente,plan:plan,
    monto:tramos.length>0?tramos[0].monto:monto,
    delivery:tramos.length>0?tramos[0].delivery:delivery,
    montoTotal:monto,deliveryTotal:delivery,
    deliveryPagado:deliveryPagado,metodo:metodo,notas:notas,
    planInicio:planInicio,tramos:tramos};

  var ventaId=id||uid();
  if(id){
    var v=data.ventas.find(function(x){return x.id===id});
    Object.assign(v,baseObj);
    // Eliminar devengados viejos de esta venta para recrearlos
    data.ventas=data.ventas.filter(function(x){return x.devengadoDe!==id});
  } else {
    baseObj.id=ventaId;
    data.ventas.push(baseObj);
  }

  // Crear registro automático en el mes siguiente si hay devengamiento
  if(tramos.length>1){
    crearRegistroDevengado({id:ventaId,cliente:cliente,plan:plan,metodo:metodo,fecha:fecha},tramos[1]);
  }

  saveData();cerrarModal();renderVentas();
}

function toggleDeliveryPagado(id){
  var v=data.ventas.find(function(x){return x.id===id});

  saveData();renderVentas();
}
function delVenta(id){
  if(!confirm('¿Eliminar esta venta?'))return;
  data.ventas=data.ventas.filter(function(x){return x.id!==id});
  saveData();renderVentas();
}

function renderCompras(){
  var h = '<h2 class="page-title">Libro de compras</h2>';

  h += '<div class="toolbar"><div class="toolbar-left">'+

    '<select id="c-month" onchange="renderCompras()"><option value="">Todos los meses</option>'+allMonths().map(function(m){return '<option value="'+m+'" '+(window._cMonth===m?'selected':'')+'>'+monthLabel(m)+'</option>'}).join('')+'</select>'+
    '<select id="c-cat" onchange="renderCompras()"><option value="">Todas las categorías</option>'+data.categoriasCompra.map(function(c){return '<option value="'+c+'" '+(window._cCat===c?'selected':'')+'>'+c+'</option>'}).join('')+'</select>'+
  '</div><button class="btn btn-green" onclick="abrirCompraModal()">+ Nueva compra</button></div>';

  var search=(document.getElementById('c-search')||{}).value||'';
  var monthF=(document.getElementById('c-month')||{}).value||'';
  var catF=(document.getElementById('c-cat')||{}).value||'';
  window._cSearch=search; window._cMonth=monthF; window._cCat=catF;

  var mesParaTotal = monthF;
  if(!mesParaTotal){
    var meses=data.compras.map(function(c){return ymOf(c.fecha)}).sort().reverse();
    mesParaTotal = meses.length ? meses[0] : todayYM();
  }
  var totalMes = sum(comprasDelMes(mesParaTotal),'monto');
  var labelMes = monthLabel(mesParaTotal);

  var list=data.compras.slice().sort(function(a,b){return b.fecha.localeCompare(a.fecha)});
  if(search) list=list.filter(function(c){return (c.proveedor||'').toLowerCase().includes(search.toLowerCase())});
  if(monthF) list=list.filter(function(c){return ymOf(c.fecha)===monthF});
  if(catF) list=list.filter(function(c){return c.categoria===catF});

  // Calcular promedio de costo/cliente/día de las compras de ingredientes con datos
  var totalMesFiltrado = sum(list,'monto');
  var ingrConDatos = list.filter(function(c){return c.categoria&&c.categoria.includes('Ingrediente')&&c.costoPorClienteDia});
  var promedioMes = ingrConDatos.length ? Math.round(ingrConDatos.reduce(function(a,c){return a+c.costoPorClienteDia},0)/ingrConDatos.length) : 0;
  var objetivo = 33000;
  var diffProm = promedioMes - objetivo;
  var colorProm = diffProm<=0?'#1D9E75':diffProm<=3000?'#BA7517':'#A32D2D';

  h += '<div class="metrics">'+
    '<div class="metric m-red"><div class="lbl">Total '+labelMes+'</div><div class="val">'+fmtGs(totalMes)+'</div></div>'+
    '<div class="metric m-gray"><div class="lbl">Total filtro actual</div><div class="val">'+fmtGs(totalMesFiltrado)+'</div></div>'+
    (promedioMes?'<div class="metric" style="border-left:3px solid '+colorProm+'"><div class="lbl">Promedio costo/cliente/día</div><div class="val" style="color:'+colorProm+'">'+fmtGs(promedioMes)+'<span style="font-size:12px;font-weight:400;color:'+colorProm+'">'+(diffProm>0?' +':'')+(diffProm?diffProm.toLocaleString('es-PY')+' vs obj':' ✅ ok')+'</span></div></div>':'')+
    '<div class="metric m-gray"><div class="lbl">Compras registradas (total)</div><div class="val">'+data.compras.length+'</div></div>'+
  '</div>';

  if(!list.length){
    h += '<div class="empty">No hay compras registradas con esos filtros.</div>';
  } else {
    h += '<table><thead><tr><th>Fecha</th><th>Categoría</th><th>Proveedor</th><th class="num">Monto</th><th class="num">Gs/cliente/día</th><th>Descripción</th><th></th></tr></thead><tbody>';
    list.forEach(function(c){
      var costoCell='—';
      if(c.costoPorClienteDia){
        var diff=c.costoPorClienteDia-objetivo;
        var col=diff<=0?'#1D9E75':diff<=3000?'#BA7517':'#A32D2D';
        costoCell='<span style="font-weight:700;color:'+col+'">'+fmtGs(c.costoPorClienteDia)+'</span>'+
          '<br><span style="font-size:10px;color:#aaa">'+c.clientes+' cli × '+c.diasMenu+'d</span>';
      }
      h+='<tr><td class="nowrap">'+c.fecha+'</td><td class="nowrap"><span class="badge b-cat">'+c.categoria+'</span></td><td>'+(c.proveedor||'—')+'</td><td class="num">'+fmtGs(c.monto)+'</td><td class="num">'+costoCell+'</td><td style="font-size:12px;color:#888780">'+(c.descripcion||'')+'</td>'+
        '<td class="nowrap"><button class="btn btn-sm" onclick="editCompra(\''+c.id+'\')">✏</button> <button class="btn btn-sm btn-danger" onclick="delCompra(\''+c.id+'\')">🗑</button></td></tr>';
    });
    var totalFiltro=sum(list,'monto');
    h+='<tr style="font-weight:700;background:#fafaf8"><td colspan="3">Total</td><td class="num">'+fmtGs(totalFiltro)+'</td><td class="num" style="font-size:12px;color:'+colorProm+'">'+(promedioMes?'Prom: '+fmtGs(promedioMes):'')+'</td><td colspan="2"></td></tr>';
    h += '</tbody></table>';
    h += '<div style="font-size:11px;color:#aaa;margin-top:8px">El costo/cliente/día se calcula solo para compras de Ingredientes donde se ingresó cantidad de clientes y días. Objetivo: Gs 33.000.</div>';
  }

  document.getElementById('main').innerHTML=h;
}

function calcCostoPorCliente(){
  var div=document.getElementById('mc-costo-preview');
  if(!div) return;
  var monto=parseFloat((document.getElementById('mc-monto')||{}).value)||0;
  var clientes=parseFloat((document.getElementById('mc-clientes')||{}).value)||0;
  var dias=parseFloat((document.getElementById('mc-dias')||{}).value)||2;
  if(!monto||!clientes){div.innerHTML='<span style="color:#888780">Ingresá monto y clientes para ver el costo por cliente/día.</span>';return}
  var costoPorClienteDia=Math.round(monto/(clientes*dias));
  var obj=33000;
  var diff=costoPorClienteDia-obj;
  var color=diff<=0?'#1D9E75':diff<=3000?'#BA7517':'#A32D2D';

    '<div><div style="font-size:11px;color:#888780">Costo por cliente/día</div>'+

    '<div style="font-size:13px;font-weight:600;color:'+color+'">'+label+' ('+( diff>0?'+':'')+diff.toLocaleString('es-PY')+' Gs)</div></div>'+
  '</div>'+
  '<div style="font-size:11px;color:#888780;margin-top:4px">'+fmtGs(monto)+' ÷ ('+clientes+' clientes × '+dias+' días) = '+fmtGs(costoPorClienteDia)+'/cliente/día</div>';

var CC_TIERS=[['prueba','Prueba'],['semanal','Semanal'],['mensual','Mensual']];
function ccVal(path,tier){
  var obj=data.costoCliente[path];

function ccInput(path,tier,extra){

function ccUpdate(path,tier,val){

function ccRow(label,path,opts){

function ccCalcRow(label,values,cls){
  var h='<tr class="'+(cls||'')+'"><td>'+label+'</td>';
  values.forEach(function(v){ h+='<td class="num">'+v+'</td>'; });
  return h+'</tr>';
}
function ccBlock(title, comidaPath, bolsaPath, cajaPath, deliveryPath, comisionPath, preciosPath, options){
  options=options||{};
  var h='<div class="card">';
  h+='<div class="section-title" style="margin-top:0">'+title+'</div>';
  h+='<table><thead><tr><th></th>'+CC_TIERS.map(function(t){return '<th class="num">'+t[1]+'</th>'}).join('')+'</tr></thead><tbody>';
  h+=ccRow('Comida',comidaPath);
  h+=ccRow('Bolsa',bolsaPath);
  h+=ccRow('Caja',cajaPath);
  if(deliveryPath) h+=ccRow('Delivery incluido',deliveryPath);
  if(comisionPath) h+=ccRow('Comisión',comisionPath);

  var totales=[],margenes=[],margenesPct=[],precios=[];
  CC_TIERS.forEach(function(t){
    var tier=t[0];
    var total=ccVal(comidaPath,tier)+ccVal(bolsaPath,tier)+ccVal(cajaPath,tier);
    if(deliveryPath) total+=ccVal(deliveryPath,tier);
    if(comisionPath) total+=ccVal(comisionPath,tier);
    var precio=ccVal(preciosPath,tier);
    var margen=precio-total;
    var margenPct=precio? (margen/precio*100):0;
    totales.push(fmtGs(total));
    margenes.push('<span class="'+(margen>=0?'v-pos':'v-neg')+'">'+fmtGs(margen)+'</span>');
    margenesPct.push('<span class="'+(margenPct>=0?'v-pos':'v-neg')+'">'+fmtPct(margenPct)+'</span>');
    precios.push(ccInput(preciosPath,tier));
  });
  h+=ccCalcRow('TOTAL',totales,'total-row');
  h+=ccCalcRow('Margen bruto por cliente',margenes);
  h+=ccCalcRow('Margen bruto %',margenesPct);
  h+=ccCalcRow('Precio del plan',precios);
  h+='</tbody></table>';
  h+='</div>';
  return h;
}

function cargarDesdeSuscripciones(){
  var btn = document.querySelector('[onclick="cargarDesdeSuscripciones()"]');
  if(btn){ btn.textContent='⏳ Cargando...'; btn.disabled=true; }
  fetch(FIREBASE_SUSC_URL)
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(fireData){
      if(!fireData){ throw new Error('No hay datos en Firebase. Abrí el sistema de suscripciones primero.'); }
      _proyData = fireData;
      document.getElementById('proyeccion-resultado').innerHTML = buildProyeccionTabla(fireData);
      if(btn){ btn.textContent='🔄 Cargar clientes activos desde suscripciones'; btn.disabled=false; }
    })
    .catch(function(e){
      document.getElementById('proyeccion-resultado').innerHTML = '<div class="alert" style="background:#FDEDEC;border:1px solid #F09595;padding:12px;border-radius:8px;color:#A32D2D">Error: '+e.message+'</div>';
      if(btn){ btn.textContent='🔄 Cargar clientes activos desde suscripciones'; btn.disabled=false; }
    });
}

function buildProyeccionTabla(fireData){
  var clientes = fireData.clientes || [];
  var subs = fireData.suscripciones || [];
  var hoy = new Date(); hoy.setHours(0,0,0,0);

  // Función para calcular días hábiles restantes
  function weekdaysBetween(startStr, endStr){
    var start = new Date(startStr+'T00:00:00');
    var end   = new Date(endStr+'T00:00:00');
    var count = 0, d = new Date(start);
    while(d <= end){ if(d.getDay()>=1&&d.getDay()<=5) count++; d.setDate(d.getDate()+1); }
    return count;
  }
  function addWeekdaysAfter(dateStr, n){
    if(!n) return dateStr;
    var d = new Date(dateStr+'T00:00:00'), count = 0;
    while(count<n){ d.setDate(d.getDate()+1); if(d.getDay()>=1&&d.getDay()<=5) count++; }
    return d.toISOString().slice(0,10);
  }
  function todayStr(){ return hoy.toISOString().slice(0,10); }

  var filas = [];
  var totalComidas = 0, totalCosto = 0;

  clientes.forEach(function(c){
    // Buscar suscripción activa
    var subs_c = subs.filter(function(s){ return s.cid === c.id; });
    subs_c.sort(function(a,b){ return b.inicio > a.inicio ? 1 : -1; });
    var s = subs_c[0];
    if(!s) return;

    var pausas = (s.pausas||[]).length;
    var entregadasEf = Math.max(0, (s.entregadas||0) - pausas);
    var restantes = s.total - entregadasEf;
    if(restantes <= 0) return;

    // Calcular fin efectivo
    var finBase = s.fin;
    var finEf = pausas > 0 ? addWeekdaysAfter(finBase, pausas) : finBase;

    // Verificar si está activo
    var finDate = new Date(finEf+'T00:00:00');
    if(finDate < hoy) return;

    var costo = restantes * COSTO_DIA;
    totalComidas += restantes;
    totalCosto += costo;

    filas.push({
      nombre: c.nombre,
      plan: s.plan||'',
      entregadas: entregadasEf,
      total: s.total,
      restantes: restantes,
      finEf: finEf,
      costo: costo
    });
  });

  if(!filas.length){
    return '<div class="empty">No hay clientes activos con comidas restantes.</div>';
  }

  filas.sort(function(a,b){ return b.restantes - a.restantes; });

  var h = '<div class="metrics" style="margin-bottom:16px">'+
    '<div class="metric m-red"><div class="lbl">Comidas restantes (total)</div><div class="val">'+totalComidas+'</div></div>'+
    '<div class="metric m-red"><div class="lbl">Costo proyectado total</div><div class="val">'+fmtGs(totalCosto)+'</div></div>'+
    '<div class="metric m-gray"><div class="lbl">Clientes activos</div><div class="val">'+filas.length+'</div></div>'+
    '<div class="metric m-gray"><div class="lbl">Costo promedio/cliente</div><div class="val">'+fmtGs(Math.round(totalCosto/filas.length))+'</div></div>'+
  '</div>';

  h += '<table><thead><tr>'+
    '<th>Cliente</th><th>Plan</th>'+
    '<th class="num">Entregadas</th><th class="num">Restantes</th>'+
    '<th>Fin del plan</th><th class="num">Costo proyectado</th>'+
  '</tr></thead><tbody>';

  filas.forEach(function(f){
    var pct = Math.round(f.entregadas/f.total*100);
    var planSimple = f.plan.includes('MENSUAL')||f.plan.includes('Mensual')?'Mensual':
                     f.plan.includes('SEMANAL')||f.plan.includes('Semanal')?'Semanal':'Prueba';
    var planColor = planSimple==='Mensual'?'b-mensual':planSimple==='Semanal'?'b-semanal':'b-prueba';
    h += '<tr>'+
      '<td><strong>'+f.nombre+'</strong></td>'+
      '<td><span class="badge '+planColor+'">'+planSimple+'</span></td>'+
      '<td class="num">'+f.entregadas+'/'+f.total+' <span style="color:#aaa;font-size:11px">('+pct+'%)</span></td>'+
      '<td class="num" style="font-weight:700;color:var(--danger)">'+f.restantes+'</td>'+
      '<td style="font-size:12px">'+f.finEf+'</td>'+
      '<td class="num" style="font-weight:700">'+fmtGs(f.costo)+'</td>'+
    '</tr>';
  });

  h += '<tr style="font-weight:700;background:#fafaf8">'+
    '<td colspan="3">TOTAL</td>'+
    '<td class="num" style="color:var(--danger)">'+totalComidas+'</td>'+
    '<td></td>'+
    '<td class="num">'+fmtGs(totalCosto)+'</td>'+
  '</tr>';
  h += '</tbody></table>';
  h += '<div style="font-size:11px;color:#aaa;margin-top:10px">Costo por día: '+fmtGs(COSTO_DIA)+' (comida Gs '+COSTO_COMIDA.toLocaleString('es-PY')+' + bolsa Gs '+COSTO_BOLSA.toLocaleString('es-PY')+' + caja Gs '+COSTO_CAJA.toLocaleString('es-PY')+'). Sin delivery.</div>';

  return h;
}

  document.getElementById('overlay').classList.add('open');
}
function guardarPlan(id){
  var nombre=document.getElementById('mp-nombre').value.trim();
  var dias=parseInt(document.getElementById('mp-dias').value)||0;
  var precio=parseFloat(document.getElementById('mp-precio').value)||0;
  if(!nombre||!precio){alert('Completá nombre y precio.');return}
  if(id){
    var p=data.planes.find(function(x){return x.id===id});
    Object.assign(p,{nombre:nombre,dias:dias,precio:precio});
  } else {
    data.planes.push({id:uid(),nombre:nombre,dias:dias,precio:precio});
  }
  saveData();cerrarModal();renderConfig();
}
function editPlan(id){ abrirPlanModal(id); }
function delPlan(id){
  if(!confirm('¿Eliminar este plan?'))return;
  data.planes=data.planes.filter(function(x){return x.id!==id});
  saveData();renderConfig();
}
function addCategoria(){
  var v=document.getElementById('new-cat').value.trim();
  if(!v)return;

// IMPORT / EXPORT
// ════════════════════════════════════════════════════════════════════
function exportAll(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='yutri_finanzas_'+todayISO()+'.json';
  a.click();
}
function importAll(ev){
  var file=ev.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      if(!confirm('Esto reemplazará todos los datos actuales con los del archivo importado. ¿Continuar?'))return;
      for(var k in DEFAULT_DATA){ if(!(k in imported)) imported[k]=DEFAULT_DATA[k]; }
      data=imported;
      saveData();
      render();
      alert('Datos importados correctamente.');
    }catch(err){
      alert('Error al leer el archivo. Asegurate de que sea un JSON exportado desde este mismo sistema.');
    }
  };
  reader.readAsText(file);
  ev.target.value='';
}

render(); // primer render inmediato con lo que haya en este navegador, para no mostrar pantalla vacía

fetch(FIREBASE_FIN_URL)
  .then(function(r){ return r.json(); })
  .then(function(remote){
    if(remote){
      for(var k in DEFAULT_DATA){ if(!(k in remote)) remote[k]=DEFAULT_DATA[k]; }
      data=remote;
      try{ localStorage.setItem('yutri_finanzas', JSON.stringify(data)); }catch(e){}
      render();
      setSyncStatus('en línea ✓');
    } else {
      // Todavía no hay nada en Firebase: subimos lo que ya teníamos guardado en este navegador.
      setSyncStatus('en línea ✓ (primera carga a Firebase)');
      saveData();
    }
  })
  .catch(function(e){
    console.error(e);
    setSyncStatus('⚠ sin conexión — mostrando datos guardados en este dispositivo');
  });
</script>
